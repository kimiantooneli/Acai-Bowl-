<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Checkout - Acai Bowl</title>

<link rel="stylesheet" href="css/style.css">

</head>


<body>


<header class="navbar">

<h2>
🍓 Acai Bowl
</h2>

<a href="cart.html">
Kembali ke Cart
</a>

</header>



<section class="checkout-section">


<h1>
Checkout Pesanan 💜
</h1>



<form id="checkout-form">


<input 
type="text"
id="name"
placeholder="Nama lengkap"
required>



<input 
type="text"
id="address"
placeholder="Alamat pengiriman"
required>



<select id="payment" required>

<option value="">
Pilih pembayaran
</option>

<option>
Transfer Bank
</option>

<option>
COD
</option>

<option>
E-Wallet
</option>


</select>



<button type="submit">

Pesan Sekarang

</button>


</form>


</section>



<script src="js/checkout.js"></script>


</body>

</html>
