<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Acai Bowl Store</title>

<link rel="stylesheet" href="css/style.css">

</head>


<body>


<div class="login-page">


    <div class="login-box">


        <h1>🍓 Acai Bowl</h1>

        <p>Fresh • Healthy • Sweet</p>


        <form id="login-form">


            <input 
            type="text" 
            id="username"
            placeholder="Username"
            required>


            <input 
            type="password"
            id="password"
            placeholder="Password"
            required>


            <button type="submit">
                Masuk
            </button>


        </form>


    </div>


</div>



<script src="js/login.js"></script>


</body>

  </html>
